<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Taquilla · Registro de Ventas</title>
    <style>
        body {font-family: Arial, sans-serif; margin: 0; padding: 0; background: #121212; color: #f5f5f5;}
        header {background: #1e88e5; padding: 1rem; text-align: center;}
        .container {padding: 1rem;}
        #asientosContainer {display: grid; grid-template-columns: repeat(10, 40px); gap: 8px; margin-top: 1rem;}
        .seat {width: 40px; height: 40px; border-radius: 4px; background: #4caf50; display: flex; align-items: center; justify-content: center; cursor: pointer;}
        .seat.selected {background: #ffca28;}
        .seat.sold {background: #e53935; cursor: not-allowed;}
        .modal {position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.6); visibility: hidden; opacity: 0; transition: opacity .3s;}
        .modal.show {visibility: visible; opacity: 1;}
        .modal-content {background: #212121; padding: 2rem; border-radius: 8px; width: 300px;}
        .modal-content input, .modal-content select {width: 100%; padding: .5rem; margin: .5rem 0; border: none; border-radius: 4px;}
        button {padding: .5rem 1rem; border: none; border-radius: 4px; cursor: pointer;}
        button.primary {background: #03a9f4; color: #fff;}
        button.danger {background: #e53935; color: #fff;}
        #ventasLog {margin-top: 2rem;}
        pre {background: #263238; padding: 1rem; border-radius: 6px; color: #fff; overflow: auto;}
    </style>
</head>
<body>
<header>
    <h1>Taquilla · Registro de Ventas</h1>
</header>
<div class="container">
    <label for="sala">Sala:</label>
    <select id="sala" onchange="generarAsientos()">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
    </select>

    <label for="pelicula">Película:</label>
    <select id="pelicula"></select>

    <div id="asientosContainer"></div>

    <div id="ventasLog">
        <h2>Ventas registradas</h2>
        <pre id="logOutput">[]</pre>
    </div>
</div>

<!-- Modal -->
<div id="ventaModal" class="modal">
    <div class="modal-content">
        <h3>Registrar Venta</h3>
        <label>Película</label>
        <input type="text" id="m_pelicula" readonly>
        <label>Sala</label>
        <input type="text" id="m_sala" readonly>
        <label>Fila</label>
        <input type="text" id="m_fila" readonly>
        <label>Número</label>
        <input type="text" id="m_numero" readonly>
        <label>Costo ($)</label>
        <input type="number" id="m_costo" value="75">
        <div style="text-align:right; margin-top: 1rem;">
            <button class="danger" onclick="cerrarModal()">Cancelar</button>
            <button class="primary" onclick="guardarVenta()">Guardar</button>
        </div>
    </div>
</div>

<script>
// ==================== Datos y estado ====================
const ventas = [];
const filas = ['A', 'B', 'C', 'D', 'E', 'F'];
const columnas = 10;
const peliculasData = [
    'El conjuro 3',
    'Godzilla y Kong: El nuevo Imperio',
    'Duna: Parte 2'
];
// Estructura: { '1': Set(), '2': Set(), '3': Set() }
const asientosVendidos = {};

// ==================== Cargar películas ====================
function cargarPeliculas() {
    const select = document.getElementById('pelicula');
    select.innerHTML = '';
    peliculasData.forEach(titulo => {
        const option = document.createElement('option');
        option.value = titulo;
        option.textContent = titulo;
        select.appendChild(option);
    });
}

// ==================== Generar asientos ====================
function generarAsientos() {
    const cont = document.getElementById('asientosContainer');
    cont.innerHTML = '';
    const sala = document.getElementById('sala').value;
    if (!asientosVendidos[sala]) asientosVendidos[sala] = new Set();

    filas.forEach(fila => {
        for (let num = 1; num <= columnas; num++) {
            const id = `${fila}${num}`;
            const seat = document.createElement('div');
            seat.className = 'seat';
            seat.textContent = num;
            seat.dataset.fila = fila;
            seat.dataset.numero = num;
            if (asientosVendidos[sala].has(id)) {
                seat.classList.add('sold');
            }
            seat.addEventListener('click', () => onclickSeat(seat));
            cont.appendChild(seat);
        }
    });
}

// ==================== Click en asiento ====================
function onclickSeat(seat) {
    if (seat.classList.contains('sold')) return; // asiento ya vendido
    seat.classList.add('selected');
    openModal(seat.dataset.fila, seat.dataset.numero);
}

// ==================== Modal ====================
function openModal(fila, numero) {
    document.getElementById('m_pelicula').value = document.getElementById('pelicula').value;
    document.getElementById('m_sala').value = document.getElementById('sala').value;
    document.getElementById('m_fila').value = fila;
    document.getElementById('m_numero').value = numero;
    document.getElementById('ventaModal').classList.add('show');
}

function cerrarModal() {
    document.getElementById('ventaModal').classList.remove('show');
    document.querySelector('.seat.selected')?.classList.remove('selected');
}

// ==================== Guardar venta ====================
function guardarVenta() {
    const venta = {
        pelicula: document.getElementById('m_pelicula').value,
        sala: document.getElementById('m_sala').value,
        asiento: {
            fila: document.getElementById('m_fila').value,
            numero: document.getElementById('m_numero').value
        },
        costo: document.getElementById('m_costo').value
    };

    ventas.push(venta);
    actualizarLog();

    // Marcar asiento como vendido
    const sala = venta.sala;
    const id = `${venta.asiento.fila}${venta.asiento.numero}`;
    asientosVendidos[sala].add(id);
    document.querySelector('.seat.selected')?.classList.remove('selected');
    generarAsientos();
    cerrarModal();
}

// ==================== Mostrar registro ====================
function actualizarLog() {
    document.getElementById('logOutput').textContent = JSON.stringify(ventas, null, 2);
}

// ==================== Inicialización ====================
cargarPeliculas();
generarAsientos();
</script>
</body>
</html>
